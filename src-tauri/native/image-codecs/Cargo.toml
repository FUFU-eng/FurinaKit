[package]
name = "furinakit-image-codecs"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
furinakit-avif-decoder = { path = "../avif-decoder" }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif", "tiff", "ico"] }
moxcms = { version = "=0.8.1", features = ["extended_range"] }
webp = { version = "=0.3.1", default-features = false }
ravif = { version = "=0.13.0", default-features = false, features = ["threading"] }
gif = { version = "=0.14.2", default-features = false, features = ["std", "raii_no_panic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "=0.18.1"
# Already locked via image; direct access retains source CMYK ink samples.
zune-jpeg = "=0.5.15"
zune-core = { version = "=0.5.3", default-features = false }
tiff = "=0.11.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[features]
default = []
av1-asm = ["ravif/asm", "furinakit-avif-decoder/av1-asm"]

[[bin]]
name = "furinakit-image-worker"
path = "src/main.rs"

[profile.release]
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true
lto = false
