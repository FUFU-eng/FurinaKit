[package]
name = "furinakit-avif-decoder"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[features]
default = []
# Requires a separately provisioned build-time assembler. No silent global installation.
av1-asm = ["rav1d/asm"]

[dependencies]
# Match rav1d platform errno values without depending on its private Rust module.
libc = "=0.2.189"
rav1d = { version = "=1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }

[build-dependencies]
cc = "=1.4.7"

[profile.release]
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true
lto = false
