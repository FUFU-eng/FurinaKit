name: Diagnose release verification
on:
  push:
    branches: [release/2.1.0-20260926]
    paths: [.github/workflows/release-diagnostics.yml]
permissions:
  contents: write # GitHub requires push access to inspect unpublished drafts; steps remain read-only.
  actions: read
jobs:
  diagnose:
    if: github.repository == 'FUFU-eng/FurinaKit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report owned prior job failure without exposing credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import subprocess,json,re
          def emit(text):
              text=text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::notice::'+text)
          p=subprocess.run(['gh','api','repos/FUFU-eng/FurinaKit/actions/jobs/108375775408/logs','--allow-escape-sequences'],capture_output=True,text=True)
          if p.returncode:
              emit('LOG_READ_FAILED '+p.stderr[-1500:])
          else:
              # The previous workflow never prints tokens or private user data.
              clean=re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]','',p.stdout)
              clean=''.join(c for c in clean if c in '\n\t' or 32<=ord(c)!=127)
              emit('PRIOR_PUBLISH_LOG_TAIL\n'+'\n'.join(clean.splitlines()[-35:])[-3200:])
          p=subprocess.run(['gh','api','repos/FUFU-eng/FurinaKit/releases?per_page=30'],capture_output=True,text=True)
          if p.returncode:
              emit('RELEASE_LOOKUP '+p.stderr[-1200:])
          else:
              matches=[x for x in json.loads(p.stdout) if x.get('tag_name')=='v2.1.0']
              d=matches[0] if matches else {'assets':[]}
              emit('RELEASE_STATE '+json.dumps({k:d.get(k) for k in ['id','tag_name','draft','target_commitish','html_url']}))
              emit('ASSET_STATE '+json.dumps([{'name':a['name'],'size':a['size'],'digest':a.get('digest')} for a in d['assets']]))
          PY
